<div class="sm"><div><div class="sub">주간 수익</div><b>${fe(w)}</b></div><div><div class="sub">월간 수익</div><b>${fe(mm)}</b><div class="sub">주간×4.33 + 월간 보스</div></div><div><div class="sub">선택한 주간 보스</div><b>${n} / 12</b></div></div>
<div class="sub" style="margin-bottom:6px">주간 보스 · 난이도를 눌러 선택하고, 다시 누르면 해제돼요. 인원이 2명이면 금액이 절반이에요.</div><div class="bg">${B.map((_,k)=>bc(c,k)).join('')}</div>
<div class="sub" style="margin:14px 0 6px">월간 보스 (주간 12개 제한과 별개)</div><div class="bg">${bc(c,B.length)}</div></div></div>`}
let dr=null,pp=null;

function askBuy(){const t=+S.item.t||0,b=bal();pop('🎉','구매 완료 처리',`<div style="text-align:left;margin-top:6px"><div class="sub">구매 금액 (모은 메소 ${fe(b)})</div><input id="ba" inputmode="numeric" value="${fm(t)}" oninput="cm(this,'bh',v=>'구매 후 남는 금액 '+fe(bal()-v))"><div class="sub" id="bh">구매 후 남는 금액 ${fe(b-t)}</div><label class="row" style="margin-top:8px"><input type="radio" name="bc" value="1" checked style="width:auto"><span>남은 금액 이월</span></label><label class="row"><input type="radio" name="bc" value="0" style="width:auto"><span>0부터 시작</span></label></div>`,[['취소','bs'],['구매 완료','','doBuy()']])}

 if(!a||a>b){pop('!','금액을 확인해 주세요','구매 금액은 0보다 크고 모은 메소 이하여야 해요.',[['확인']]);return}
 (S.buys=S.buys||[]).push({n:S.item.n||'(이름 없음)',d:key(new Date()),a,x:keep?0:b-a});
 S.item={n:'',t:0,m:''};dr=null;sv();pop('🎉','구매를 기록했어요','새 목표 아이템을 설정해 보세요.',[['닫기','bs'],['새 목표 설정','','pp=null;tab=2;dr=null;R()']])}
function askUndo(i){pop('!','구매 기록을 취소할까요?',e(S.buys[i].n)+' 구매가 취소되고 모은 메소가 되돌아와요.',[['아니요','bs'],['취소하기','','delBuy('+i+')']])}
function delBuy(i){S.buys.splice(i,1);sv();pop('✓','취소했어요','구매 기록을 지웠어요.',[['확인']])}
function hist(){const b=S.buys||[];return `<div class="cd"><b>구매 이력</b>${b.length?b.map((x,i)=>`<div class="row" style="margin-top:8px;justify-content:space-between"><span style="flex:1;min-width:0">${e(x.n)} <span class="sub">${x.d}${x.x?' · 0부터 시작 (소멸 '+fe(x.x)+')':''}</span></span><b>-${fe(x.a)}</b><span style="cursor:pointer" title="구매 취소" onclick="askUndo(${i})">✕</span></div>`).reverse().join(''):'<div class="sub" style="margin-top:6px">아직 구매 기록이 없어요</div>'}</div>`}
document.addEventListener('keydown',ev=>{if(ev.key=='Escape'&&pp){pp=null;R()}});

const cs=()=>S.ch[S.cur];

function sD(i,v){const s=cs().s[i];s.d=v;s.p=1;sv();R()}

function selAll(v){S.ch[cc].s.forEach((s,i)=>{if(s&&s.d)chk[cc+'|'+i]=v});R()}

function del(i){S.rec[sel].splice(i,1);if(!S.rec[sel].length)delete S.rec[sel];sv();R()}
function add(){const m=$('#me').value;let a,mm=m;
 if(fs=='보스'){const ks=Object.keys(chk).filter(k=>chk[k]);if(!ks.length)return;a=0;const dt=ks.map(k=>{const[c,i]=k.split('|'),s=S.ch[c].s[i];a+=amt(s,+i);return S.ch[c].n+': '+s.b+'('+s.d+'·'+s.p+'인)'});mm=(m?m+' ':'')+dt.join(', ');chk={}}
 else{a=+$('#am').value.replace(/,/g,'');if(!a)return}
 (S.rec[sel]=S.rec[sel]||[]).push({s:fs,a,m:mm});sv();R()}
function R(){$('#nv').innerHTML=['대시보드','보스 설정','아이템 설정'].map((t,i)=>`<div class="nv ${tab==i?'on':''}" tabindex="0" onclick="tab=${i};dr=null;R()" onkeydown="if(event.key=='Enter')this.click()">${t}</div>`).join('');$('#mn').innerHTML=[D,Bs,It][tab]();$('#pp').innerHTML=pp?`<div class="ov" onclick="if(event.target==this){pp=null;R()}"><div class="md" role="dialog" aria-modal="true"><div class="ic">${pp.ic}</div><b>${pp.t}</b><div class="sub">${pp.m}</div><div class="row" style="justify-content:center;margin-top:6px">${pp.b.map(x=>`<button class="${x[1]||''}" onclick="${x[2]||'pp=null;R()'}">${x[0]}</button>`).join('')}</div></div></div>`:''}
